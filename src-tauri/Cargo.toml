[package]
name = "koinkat"
version = "0.1.5"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Marco Sburlino"]
description = "Local-first multi-currency personal finance manager"
repository = "https://github.com/MarcoSburlino/Koinkat"
# This crate is the app shell, never a library for anyone else. Marking it
# unpublished also lets cargo-about skip it when collecting THIRD-PARTY
# licences - it is the work being licensed, not a dependency of it.
publish = false

[lib]
name = "koinkat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Rust tests live in tests/, not in the library. On Windows a test executable
# that links the Tauri runtime needs the Common Controls v6 manifest to start
# at all, and build.rs can scope that to tests/ (rustc-link-arg-tests) without
# touching the shipped app; the library's own unit-test harness is reachable
# by no such scope, so it would crash on launch (STATUS_ENTRYPOINT_NOT_FOUND).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "devtools" feature: release binaries must not expose the web inspector.
# Debug builds still get devtools automatically via debug_assertions.
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used only by db_tx.rs, which borrows the pool tauri-plugin-sql already
# opened. Version and features are kept in step with the plugin's own
# declaration (sqlx/sqlite + sqlx/runtime-tokio) so cargo unifies both on a
# single sqlx instance rather than linking two SQLite drivers.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
log = "0.4"
# OS credential store for the Enable Banking private key. Each feature
# activates only on its own platform (Windows Credential Manager, macOS
# Keychain, freedesktop Secret Service via D-Bus).
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[dev-dependencies]
# The mock runtime behind db_tx.rs's IPC round-trip tests. Dev-only: with the
# edition-2021 resolver, dev-dependency features apply to `cargo test` builds
# and never reach `tauri build` or a released binary.
tauri = { version = "2", features = ["test"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
