name: Release

# Builds installers for all three platforms and attaches them to a DRAFT
# GitHub release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The maintainer reviews the draft and publishes it manually.
#
# It can also be started by hand (Actions > Release > Run workflow) to
# test that the bundles build without publishing anything: a manual run
# creates no tag and no release, and attaches the installers to the run
# as downloadable workflow artifacts instead.
#
# Signing: macOS signing and notarization activate automatically once the
# six APPLE_* repository secrets exist (setup guide: docs/signing.md).
# The export step below sets the env vars only when a secret is
# non-empty, because the Tauri bundler treats an empty APPLE_CERTIFICATE
# as present and would fail the build; with no secrets configured,
# builds stay unsigned exactly as before. Windows builds are not signed
# (see docs/code-signing-policy.md).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        # Keep this package list in sync with ci.yml.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple targets on the macOS leg (universal build); empty
          # elsewhere, which the action treats as no extra targets.
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The notice file ships inside the installer as a bundle resource, so a
      # stale one is a defect in the released artifact, not just in the repo.
      # Only the Linux leg checks it: the result is platform-independent and
      # installing cargo-about on all three legs is wasted minutes.
      - name: THIRD-PARTY-LICENSES.md matches the lockfiles
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-about --locked --features cli
          npm run licenses:check
      - name: Enable macOS signing when secrets are configured
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Tauri bundler treats empty signing vars as present, so only
          # export the ones that hold a value. Heredoc syntax keeps
          # multi-line values (the base64 certificate) intact.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              {
                echo "$v<<KOINKAT_EOF_$v"
                echo "${!v}"
                echo "KOINKAT_EOF_$v"
              } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Universal macOS binary (Apple Silicon + Intel); empty on the
          # other platforms.
          args: ${{ matrix.tauri-args }}
          # On a tag push these carry the tag and a draft release is
          # created as usual. On a manual run there is no tag, so both
          # stay empty: tauri-action then builds and skips every upload
          # (its tagName check is a plain truthiness test), and the
          # bundles come back as workflow artifacts instead.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Koinkat {0}', github.ref_name) || '' }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          # Keep this in step with docs/code-signing-policy.md. It said "builds
          # are unsigned" long after macOS signing was set up in 0.1.1, and told
          # macOS users to strip quarantine from an app that is in fact signed
          # and notarized - unnecessary, and a bad habit to teach.
          releaseBody: |
            See CHANGELOG.md for what changed.

            Install notes - the full guide is in the README:

            - Windows: the installer is not code-signed, so SmartScreen shows "Windows protected your PC". Click "More info", then "Run anyway". Installing with `winget install MarcoSburlino.Koinkat` avoids the warning entirely.
            - macOS (universal, Apple Silicon and Intel): signed with an Apple Developer ID certificate and notarized, so it should open normally. If you do get an "unidentified developer" block, use System Settings > Privacy & Security > Open Anyway.
            - Linux: the AppImage needs `chmod +x` before it runs; if it reports a FUSE error, install libfuse2 (`sudo apt install libfuse2`) or run it with `--appimage-extract-and-run`. deb and rpm install normally.
          releaseDraft: true
          prerelease: false
